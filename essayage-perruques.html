<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#17101A">
<title>Miroir — essayage virtuel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,500&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#17101A; --ink2:#221629; --plum:#3A2338;
  --satin:#C79BB0; --champagne:#E7C79B; --lace:#D7BEA4;
  --cream:#F7F0EA; --muted:rgba(247,240,234,.56); --line:rgba(247,240,234,.13);
  --display:'Fraunces',Georgia,serif; --body:'Instrument Sans',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--ink); color:var(--cream); font-family:var(--body);
  overscroll-behavior:none; -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--champagne);outline-offset:3px;border-radius:4px}

#app{height:100dvh;display:flex;flex-direction:column;position:relative;overflow:hidden}

/* ---------------------------------------------------------------- accueil */
#intro{
  position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;
  justify-content:flex-end;gap:26px;
  padding:40px 28px calc(44px + env(safe-area-inset-bottom));
  background:radial-gradient(120% 80% at 50% 0%,var(--plum) 0%,var(--ink2) 45%,var(--ink) 100%);
}
#intro::before{
  content:'';position:absolute;inset:0;opacity:.16;pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='34' height='60' viewBox='0 0 34 60'><g fill='none' stroke='%23D7BEA4' stroke-width='.7'><path d='M17 0 L34 10 L34 30 L17 40 L0 30 L0 10 Z'/><path d='M17 30 L34 40 L34 60 L17 70 L0 60 L0 40 Z'/></g></svg>");
  -webkit-mask-image:linear-gradient(to bottom,#000 0%,transparent 62%);
  mask-image:linear-gradient(to bottom,#000 0%,transparent 62%);
}
.eyebrow{
  position:relative;font-size:11px;font-weight:500;letter-spacing:.22em;
  text-transform:uppercase;color:var(--lace)
}
#intro h1{
  position:relative;font-family:var(--display);font-weight:300;
  font-size:clamp(42px,13vw,64px);line-height:.98;letter-spacing:-.02em;
}
#intro h1 em{font-style:italic;font-weight:500;color:var(--champagne)}
#intro p{position:relative;color:var(--muted);font-size:15px;line-height:1.55;max-width:34ch}
.cta{
  position:relative;display:flex;align-items:center;justify-content:space-between;gap:14px;
  width:100%;padding:19px 24px;border-radius:100px;
  background:var(--champagne);color:#1B1116;font-weight:600;font-size:16px;
  transition:transform .18s ease, filter .18s ease;
}
.cta:active{transform:scale(.985);filter:brightness(.95)}
.cta svg{flex:0 0 auto}
.fineprint{position:relative;font-size:12.5px;color:rgba(247,240,234,.4);text-align:center}

/* ---------------------------------------------------------------- studio */
#studio{display:flex;flex-direction:column;height:100%;opacity:0;transition:opacity .5s ease}
#studio.on{opacity:1}
.stage{position:relative;flex:1;min-height:0;background:#0D0810;overflow:hidden}
#c{position:absolute;inset:0;width:100%;height:100%;display:block}
#status{
  position:absolute;left:50%;bottom:16px;transform:translateX(-50%);
  padding:8px 16px;border-radius:100px;background:rgba(13,8,16,.72);
  backdrop-filter:blur(10px);font-size:12.5px;color:var(--muted);white-space:nowrap;
  transition:opacity .4s ease;pointer-events:none
}
#status[hidden]{display:none}

.deck{
  flex:0 0 auto;padding:14px 0 calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(to bottom,var(--ink2),var(--ink));
  border-top:1px solid var(--line);
}
.now{text-align:center;padding:0 20px 12px}
.now b{font-family:var(--display);font-weight:500;font-size:19px;letter-spacing:-.01em}
.now span{display:block;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:3px}

/* signature : les perruques pendent à une tringle */
.rail{position:relative;padding:0 20px}
.rail::before{content:'';position:absolute;left:20px;right:20px;top:0;height:1px;background:var(--line)}
.strands{display:flex;gap:14px;justify-content:center;overflow-x:auto;scrollbar-width:none;padding:0 2px}
.strands::-webkit-scrollbar{display:none}
.strand{
  position:relative;flex:0 0 auto;padding-top:9px;
  transition:transform .3s cubic-bezier(.2,.8,.3,1),opacity .3s ease;
  opacity:.42;transform:translateY(0)
}
.strand img{
  display:block;width:60px;height:126px;object-fit:cover;
  border-radius:2px 2px 26px 26px;
  -webkit-mask-image:linear-gradient(to bottom,#000 68%,rgba(0,0,0,.15) 100%);
  mask-image:linear-gradient(to bottom,#000 68%,rgba(0,0,0,.15) 100%);
}
.strand::before{
  content:'';position:absolute;top:0;left:50%;width:1px;height:9px;
  background:var(--line);transform:translateX(-50%)
}
.strand[aria-pressed="true"]{opacity:1;transform:translateY(9px)}
.strand[aria-pressed="true"]::before{background:var(--champagne);width:2px;top:-9px;height:18px}
.strand[aria-pressed="true"]::after{
  content:'';position:absolute;top:-12px;left:50%;width:7px;height:7px;border-radius:50%;
  background:var(--champagne);transform:translateX(-50%)
}

.bar{display:flex;align-items:center;justify-content:space-between;padding:20px 26px 0}
.ghost{
  font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  padding:10px 0;min-width:78px
}
.ghost.right{text-align:right}
.shutter{
  width:64px;height:64px;border-radius:50%;border:1.5px solid var(--champagne);
  display:grid;place-items:center;transition:transform .16s ease
}
.shutter i{width:48px;height:48px;border-radius:50%;background:var(--champagne);display:block;transition:transform .16s ease}
.shutter:active i{transform:scale(.86)}

.tune{padding:18px 26px 4px;display:grid;gap:16px}
.tune[hidden]{display:none}
.slider{display:grid;grid-template-columns:70px 1fr;align-items:center;gap:14px}
.slider label{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;height:2px;border-radius:2px;
  background:var(--line);
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:22px;height:22px;border-radius:50%;
  background:var(--cream);border:5px solid var(--ink2);box-shadow:0 0 0 1px var(--line)
}
input[type=range]::-moz-range-thumb{
  width:22px;height:22px;border-radius:50%;background:var(--cream);
  border:5px solid var(--ink2);box-shadow:0 0 0 1px var(--line)
}

/* ---------------------------------------------------------------- photo */
#shot{
  position:absolute;inset:0;z-index:40;background:var(--ink);
  display:flex;flex-direction:column;
  padding-bottom:calc(20px + env(safe-area-inset-bottom))
}
#shot[hidden]{display:none}
#shot img{flex:1;min-height:0;width:100%;object-fit:contain}
.shotbar{display:flex;gap:10px;padding:18px 20px 0}
.pill{
  flex:1;text-align:center;padding:15px 10px;border-radius:100px;
  border:1px solid var(--line);font-size:14px;font-weight:500
}
.pill.solid{background:var(--champagne);color:#1B1116;border-color:var(--champagne)}

/* ---------------------------------------------------------------- erreur */
#err{
  position:absolute;inset:0;z-index:50;background:var(--ink);
  display:flex;flex-direction:column;justify-content:center;gap:14px;padding:32px 30px
}
#err[hidden]{display:none}
#err h2{font-family:var(--display);font-weight:500;font-size:26px;letter-spacing:-.01em}
#err p{color:var(--muted);font-size:14.5px;line-height:1.6}
#err .cta{margin-top:10px;justify-content:center}

@media (min-width:760px){
  body{background:radial-gradient(80% 60% at 50% -10%,#2A1A2C 0%,var(--ink) 60%)}
  #app{max-width:540px;margin:0 auto;border-left:1px solid var(--line);border-right:1px solid var(--line)}
  #intro{justify-content:center;padding:0 44px}
  #intro h1{font-size:66px}
  .strand img{width:68px;height:142px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app">

  <section id="intro">
    <div>
      <div class="eyebrow">Essayage virtuel</div>
      <h1>Voyez-la<br><em>sur vous.</em></h1>
    </div>
    <p>Activez la caméra, choisissez une perruque, bougez la tête. L'image reste sur votre appareil : rien n'est envoyé, rien n'est enregistré.</p>
    <button class="cta" id="go">
      Activer la caméra
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg>
    </button>
    <div class="fineprint">Caméra frontale · mobile ou ordinateur</div>
  </section>

  <section id="studio" aria-hidden="true">
    <div class="stage">
      <canvas id="c"></canvas>
      <div id="status">Préparation du suivi du visage…</div>
    </div>

    <div class="deck">
      <div class="now"><b id="wname">—</b><span id="wdetail"></span></div>
      <div class="rail"><div class="strands" id="strands" role="group" aria-label="Choix de la perruque"></div></div>

      <div class="bar">
        <button class="ghost" id="tuneBtn" aria-expanded="false">Ajuster</button>
        <button class="shutter" id="shoot" aria-label="Prendre une photo"><i></i></button>
        <button class="ghost right" id="reset">Recentrer</button>
      </div>

      <div class="tune" id="tune" hidden>
        <div class="slider"><label for="sSize">Taille</label><input type="range" id="sSize" min="70" max="140" value="100"></div>
        <div class="slider"><label for="sTop">Hauteur</label><input type="range" id="sTop" min="-40" max="40" value="0"></div>
        <div class="slider" id="sideRow" hidden><label for="sSide">Latéral</label><input type="range" id="sSide" min="-50" max="50" value="0"></div>
      </div>
    </div>
  </section>

  <div id="shot" hidden>
    <img id="shotImg" alt="Votre essayage">
    <div class="shotbar">
      <button class="pill" id="again">Reprendre</button>
      <button class="pill" id="share" hidden>Partager</button>
      <button class="pill solid" id="save">Enregistrer</button>
    </div>
  </div>

  <div id="err" hidden>
    <h2 id="errT"></h2>
    <p id="errP"></p>
    <button class="cta" id="errBtn">Réessayer</button>
  </div>
</div>

<video id="v" playsinline muted autoplay style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none"></video>

/* Repères dans l'image de perruque (1000 × 1500) */
const WIG_W = 1000, WIG_H = 1500;
const ANCHOR_X = 500, ANCHOR_Y = 200;   // sommet de la ligne frontale
const WIDTH_RATIO = 2.62;               // largeur perruque ÷ largeur du visage

const $ = s => document.querySelector(s);
const video = $('#v'), canvas = $('#c'), ctx = canvas.getContext('2d');

let stream=null, landmarker=null, tracking=false, current=0;
let imgs={}, running=false, lastVT=-1, lostAt=0;
let userScale=1, userTop=0, userSide=0;
let sm=null; // pose lissée
let segmenter=null, segBusy=false, lastSegVT=-1, hairMask=null; // suppression des vrais cheveux

/* ------------------------------------------------------------- assets */
function loadImg(src){return new Promise((ok,ko)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=ko;i.src=src;});}

function buildRail(){
  const el=$('#strands');
  WIGS.forEach((w,i)=>{
    const b=document.createElement('button');
    b.className='strand'; b.type='button';
    b.setAttribute('aria-pressed', i===0?'true':'false');
    b.setAttribute('aria-label', w.name+' — '+w.detail);
    b.innerHTML='<img alt="" src="'+ASSETS['thumb_'+w.id]+'">';
    b.onclick=()=>select(i);
    el.appendChild(b);
  });
  select(0);
}
function select(i){
  current=i;
  [...$('#strands').children].forEach((c,j)=>c.setAttribute('aria-pressed', j===i?'true':'false'));
  $('#wname').textContent=WIGS[i].name;
  $('#wdetail').textContent=WIGS[i].detail;
}

/* -------------------------------------------------------------- erreurs */
function fail(title, msg, label='Réessayer', action=start){
  $('#errT').textContent=title; $('#errP').textContent=msg;
  $('#errBtn').firstChild.nodeValue=label;
  $('#errBtn').onclick=()=>{$('#err').hidden=true; action();};
  $('#err').hidden=false;
}

/* -------------------------------------------------------------- caméra */
async function start(){
  if(!navigator.mediaDevices?.getUserMedia){
    return fail('Caméra indisponible',
      "Ce navigateur ne donne pas accès à la caméra. Ouvrez le lien dans Safari, Chrome ou Firefox — et vérifiez que l'adresse commence bien par https://.",
      'Fermer', ()=>{});
  }
  try{
    stream = await navigator.mediaDevices.getUserMedia({
      video:{facingMode:'user', width:{ideal:1280}, height:{ideal:960}}, audio:false
    });
  }catch(e){
    const denied = e.name==='NotAllowedError' || e.name==='SecurityError';
    return fail(
      denied ? "L'accès à la caméra est bloqué" : "Caméra introuvable",
      denied
        ? "Autorisez la caméra pour ce site : touchez l'icône à gauche de l'adresse, activez « Caméra », puis rechargez la page."
        : "Aucune caméra n'a répondu. Vérifiez qu'aucune autre application ne l'utilise, puis réessayez.",
      'Réessayer'
    );
  }
  video.srcObject=stream;
  try{ await video.play(); }catch(_){}
  $('#intro').style.display='none';
  $('#studio').classList.add('on');
  $('#studio').setAttribute('aria-hidden','false');
  if(!running){ running=true; requestAnimationFrame(loop); }
  initTracking();
}

/* ------------------------------------------------------------- tracking */
async function initTracking(){
  if(landmarker) return;
  try{
    const {FilesetResolver, FaceLandmarker} =
      await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs');
    const files = await FilesetResolver.forVisionTasks(
      'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
    const MODEL='https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task';
    const make = d => FaceLandmarker.createFromOptions(files,{
      baseOptions:{modelAssetPath:MODEL, delegate:d}, runningMode:'VIDEO', numFaces:1
    });
    landmarker = await make('GPU').catch(()=>make('CPU'));
    tracking=true;
    say('Placez votre visage dans le cadre', 2600);
    initSegmenter(files); // en tâche de fond — n'empêche pas le suivi de démarrer
  }catch(e){
    tracking=false;
    $('#sideRow').hidden=false;
    say('Suivi indisponible — ajustez la perruque à la main', 6000);
  }
}

/* atténue les vrais cheveux visibles pour que la perruque les remplace
   au lieu de se superposer dessus */
async function initSegmenter(files){
  try{
    const {ImageSegmenter} =
      await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs');
    const MODEL='https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_multiclass_256x256/float32/latest/selfie_multiclass_256x256.tflite';
    const make = d => ImageSegmenter.createFromOptions(files,{
      baseOptions:{modelAssetPath:MODEL, delegate:d},
      outputCategoryMask:true, outputConfidenceMasks:false, runningMode:'VIDEO'
    });
    segmenter = await make('GPU').catch(()=>make('CPU'));
  }catch(e){
    segmenter=null; // pas bloquant : la perruque continue de fonctionner sans suppression
  }
}
function onSeg(result){
  segBusy=false;
  const m=result.categoryMask;
  if(!m) return;
  hairMask={data:m.getAsUint8Array(), w:m.width, h:m.height};
  m.close();
}

let sayTimer=null;
function say(txt, ms){
  const s=$('#status'); s.textContent=txt; s.hidden=false; s.style.opacity='1';
  clearTimeout(sayTimer);
  if(ms) sayTimer=setTimeout(()=>{s.style.opacity='0';setTimeout(()=>s.hidden=true,420);},ms);
}

/* --------------------------------------------------------------- rendu */
let view={s:1,dx:0,dy:0};
function fit(){
  const r=canvas.getBoundingClientRect();
  const dpr=Math.min(devicePixelRatio||1, 2);
  const w=Math.round(r.width*dpr), h=Math.round(r.height*dpr);
  if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;}
}
function drawVideo(){
  const cw=canvas.width, ch=canvas.height;
  const vw=video.videoWidth, vh=video.videoHeight;
  if(!vw||!vh) return false;
  const s=Math.max(cw/vw, ch/vh);
  view={s, dx:(cw-vw*s)/2, dy:(ch-vh*s)/2};
  ctx.save(); ctx.translate(cw,0); ctx.scale(-1,1);
  ctx.drawImage(video, view.dx, view.dy, vw*s, vh*s);
  ctx.restore();
  return true;
}
const P = (L,i,vw,vh)=>({
  x: canvas.width - (view.dx + L[i].x*vw*view.s),   // miroir
  y: view.dy + L[i].y*vh*view.s
});
const lerp=(a,b,t)=>a+(b-a)*t;

function pose(L){
  const vw=video.videoWidth, vh=video.videoHeight;
  const a=P(L,454,vw,vh), b=P(L,234,vw,vh);
  const fore=P(L,10,vw,vh), nose=P(L,4,vw,vh);
  const w=Math.hypot(b.x-a.x, b.y-a.y);
  let ang=Math.atan2(b.y-a.y, b.x-a.x);
  const mid={x:(a.x+b.x)/2, y:(a.y+b.y)/2};
  const yaw=Math.max(-.45, Math.min(.45, (nose.x-mid.x)/Math.max(w,1)));
  const t = sm ? .34 : 1;
  let d=ang-(sm?sm.ang:ang); while(d>Math.PI)d-=2*Math.PI; while(d<-Math.PI)d+=2*Math.PI;
  sm = sm ? {
    x:lerp(sm.x,fore.x,t), y:lerp(sm.y,fore.y,t),
    w:lerp(sm.w,w,t), ang:sm.ang+d*t, yaw:lerp(sm.yaw,yaw,t)
  } : {x:fore.x, y:fore.y, w, ang, yaw};
  return sm;
}

/* assombrit les pixels identifiés comme "cheveux" (classe 1 du modèle
   selfie_multiclass) avant de dessiner la perruque par-dessus — les
   vrais cheveux qui dépassent du contour de la perruque se voient
   nettement moins au lieu de rester en pleine lumière */
let maskCv=null, maskCtx=null;
function drawHairSuppression(){
  if(!hairMask) return;
  const {data,w,h}=hairMask;
  if(!maskCv){ maskCv=document.createElement('canvas'); maskCtx=maskCv.getContext('2d'); }
  if(maskCv.width!==w||maskCv.height!==h){ maskCv.width=w; maskCv.height=h; }
  const id=maskCtx.createImageData(w,h);
  for(let i=0;i<w*h;i++){
    const hair = data[i]===1 ? 255 : 0;
    id.data[i*4]=20; id.data[i*4+1]=16; id.data[i*4+2]=14; id.data[i*4+3]=hair;
  }
  maskCtx.putImageData(id,0,0);

  const cw=canvas.width;
  ctx.save();
  ctx.globalAlpha=0.62;
  ctx.translate(cw,0); ctx.scale(-1,1); // même miroir que la vidéo
  ctx.imageSmoothingEnabled=true;
  ctx.drawImage(maskCv, view.dx, view.dy, video.videoWidth*view.s, video.videoHeight*view.s);
  ctx.restore();
}

function drawWig(alpha){
  const img=imgs[WIGS[current].id]; if(!img) return;
  const cw=canvas.width, ch=canvas.height;
  let p;
  if(sm && tracking) p=sm;
  else p={x:cw/2, y:ch*0.22, w:Math.min(cw,ch)*0.34, ang:0, yaw:0};

  const s = (p.w*WIDTH_RATIO*userScale)/WIG_W;
  ctx.save();
  ctx.globalAlpha=alpha;
  ctx.translate(p.x + userSide*p.w, p.y + userTop*p.w);
  ctx.rotate(p.ang);
  ctx.translate(p.yaw*p.w*0.34, 0);
  ctx.scale(s*(1-Math.abs(p.yaw)*0.22), s);
  ctx.drawImage(img, -ANCHOR_X, -ANCHOR_Y, WIG_W, WIG_H);
  ctx.restore();
}

function loop(){
  requestAnimationFrame(loop);
  if(video.readyState<2) return;
  fit();
  if(!drawVideo()) return;

  if(tracking && landmarker && video.currentTime!==lastVT){
    lastVT=video.currentTime;
    try{
      const r=landmarker.detectForVideo(video, performance.now());
      if(r.faceLandmarks?.length){ pose(r.faceLandmarks[0]); lostAt=0; $('#status').hidden=true; }
      else if(!lostAt) lostAt=performance.now();
    }catch(_){}
  }
  if(segmenter && !segBusy && video.currentTime!==lastSegVT){
    lastSegVT=video.currentTime;
    segBusy=true;
    try{ segmenter.segmentForVideo(video, performance.now(), onSeg); }
    catch(_){ segBusy=false; }
  }
  drawHairSuppression();
  let a=1;
  if(tracking){
    if(!sm) a=0;
    else if(lostAt) a=Math.max(0, 1-(performance.now()-lostAt-500)/500);
  }
  if(a>0) drawWig(Math.min(a,1));
}

/* ------------------------------------------------------------- contrôles */
$('#go').onclick=start;
$('#tuneBtn').onclick=()=>{
  const t=$('#tune'), open=t.hidden;
  t.hidden=!open; $('#tuneBtn').setAttribute('aria-expanded',String(open));
  $('#tuneBtn').textContent = open ? 'Masquer' : 'Ajuster';
};
$('#sSize').oninput=e=>userScale=e.target.value/100;
$('#sTop').oninput=e=>userTop=e.target.value/100;
$('#sSide').oninput=e=>userSide=e.target.value/100;
$('#reset').onclick=()=>{
  userScale=1;userTop=0;userSide=0;sm=null;
  $('#sSize').value=100;$('#sTop').value=0;$('#sSide').value=0;
  say('Perruque recentrée',1600);
};

/* glisser sur l'image pour ajuster */
let drag=null;
canvas.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,t:userTop,s:userSide};canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointermove',e=>{
  if(!drag) return;
  const ref=Math.max(sm?sm.w:canvas.width*0.3,60)/(Math.min(devicePixelRatio||1,2));
  userSide=Math.max(-.6,Math.min(.6, drag.s+(e.clientX-drag.x)/ref));
  userTop =Math.max(-.6,Math.min(.6, drag.t+(e.clientY-drag.y)/ref));
  $('#sTop').value=Math.round(userTop*100); $('#sSide').value=Math.round(userSide*100);
});
['pointerup','pointercancel'].forEach(ev=>canvas.addEventListener(ev,()=>drag=null));

/* ---------------------------------------------------------------- photo */
let blobUrl=null;
$('#shoot').onclick=()=>{
  canvas.toBlob(b=>{
    if(!b) return say("La photo n'a pas pu être prise",2500);
    if(blobUrl) URL.revokeObjectURL(blobUrl);
    blobUrl=URL.createObjectURL(b);
    $('#shotImg').src=blobUrl;
    $('#shot').hidden=false;
    $('#shot').dataset.blob='1'; window._shotBlob=b;
    $('#share').hidden = !(navigator.canShare && navigator.canShare({files:[new File([b],'x.png',{type:'image/png'})]}));
  },'image/png');
};
$('#again').onclick=()=>{$('#shot').hidden=true;};
$('#save').onclick=()=>{
  const a=document.createElement('a');
  a.href=blobUrl; a.download='essayage-'+WIGS[current].id+'.png'; a.click();
};
$('#share').onclick=async()=>{
  try{
    await navigator.share({files:[new File([window._shotBlob],'essayage.png',{type:'image/png'})],
      title:'Mon essayage'});
  }catch(_){}
};

/* ------------------------------------------------------------ démarrage */
(async()=>{
  buildRail();
  await Promise.all(WIGS.map(async w=>{ imgs[w.id]=await loadImg(ASSETS['wig_'+w.id]); }));
})();
window.addEventListener('pagehide',()=>{ stream?.getTracks().forEach(t=>t.stop()); });
</script>
</body>
