<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test WebGL / Three.js</title>
<style>
  html,body{margin:0;height:100%;background:#111;color:#fff;font-family:sans-serif}
  #log{position:fixed;top:0;left:0;right:0;padding:10px;font:14px monospace;background:rgba(0,0,0,.7);white-space:pre-wrap;z-index:2}
</style>
</head>
<body>
<div id="log">chargement…</div>
<script type="module">
const log = document.getElementById('log');
const write = (s) => { log.textContent += '\n' + s; };

write('1. script démarré');

try{
  const THREE = await import('https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js');
  write('2. import Three.js OK, revision ' + THREE.REVISION);

  const renderer = new THREE.WebGLRenderer({antialias:true});
  write('3. WebGLRenderer créé (contexte: ' + (renderer.getContext()?.constructor?.name || '?') + ')');

  renderer.setSize(Math.min(window.innerWidth,480), 320);
  document.body.appendChild(renderer.domElement);
  write('4. canvas ajouté au DOM');

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(50, 480/320, 0.1, 100);
  camera.position.z = 4;

  scene.add(new THREE.AmbientLight(0xffffff, 0.6));
  const light = new THREE.DirectionalLight(0xffffff, 1);
  light.position.set(2,2,3);
  scene.add(light);

  const cube = new THREE.Mesh(
    new THREE.BoxGeometry(1.5,1.5,1.5),
    new THREE.MeshStandardMaterial({color:0xE7C79B})
  );
  scene.add(cube);
  write('5. scène + cube créés');

  function loop(){
    requestAnimationFrame(loop);
    cube.rotation.x += 0.01;
    cube.rotation.y += 0.015;
    renderer.render(scene, camera);
  }
  loop();
  write('6. boucle de rendu lancée — tu dois voir un cube beige tourner ci-dessous');
}catch(e){
  write('ERREUR : ' + e.message);
  write(e.stack || '');
}
</script>
</body>
</html>
